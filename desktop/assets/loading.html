<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>CHHOTI DON</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 800px at 50% -10%, #2a0d2e 0%, #12081a 45%, #050308 100%);
        color: #f6e9ef; overflow: hidden;
      }
      .card { text-align: center; width: 420px; max-width: 90vw; padding: 24px; }
      .orb {
        width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%;
        background: conic-gradient(from 0deg, #fb7185, #d946ef, #8b5cf6, #fb7185);
        box-shadow: 0 0 48px rgba(244,63,94,.45); animation: spin 3.2s linear infinite;
        position: relative;
      }
      .orb::after {
        content: ""; position: absolute; inset: 10px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(20,8,26,.9) 70%);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; letter-spacing: .28em; margin: 0 0 6px; font-weight: 700; }
      .sub { font-size: 12px; color: #b79fb0; margin: 0 0 26px; letter-spacing: .05em; }
      .status { font-size: 13px; color: #e7cede; min-height: 20px; }
      .bar { margin: 18px auto 0; width: 220px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
      .bar > span { display: block; height: 100%; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #fb7185, #d946ef); animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-120%);} 100% { transform: translateX(320%);} }
      .error { display: none; text-align: left; margin-top: 22px; padding: 16px; border-radius: 16px;
        border: 1px solid rgba(251,191,36,.3); background: rgba(120,53,15,.18); }
      .error h2 { font-size: 13px; margin: 0 0 8px; color: #fcd34d; letter-spacing: .04em; }
      .error p { font-size: 12px; margin: 4px 0; color: #f5d9a8; word-break: break-word; }
      .error code { font-size: 11px; color: #ffd7a0; }
      .actions { margin-top: 14px; display: flex; gap: 8px; }
      button {
        font-family: inherit; font-size: 12px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
        border: 1px solid rgba(251,113,133,.4); background: rgba(244,63,94,.18); color: #ffe4ec;
      }
      button:hover { background: rgba(244,63,94,.3); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="orb"></div>
      <h1>CHHOTI DON</h1>
      <p class="sub">Private AI command center</p>
      <p class="status" id="status">Starting services…</p>
      <div class="bar" id="bar"><span></span></div>

      <div class="error" id="error">
        <h2 id="err-title">Startup problem</h2>
        <p id="err-reason"></p>
        <p id="err-log"></p>
        <div class="actions">
          <button id="retry">Retry</button>
        </div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const bar = document.getElementById('bar');
      const errorBox = document.getElementById('error');
      const errReason = document.getElementById('err-reason');
      const errLog = document.getElementById('err-log');

      if (window.chhotiLoader) {
        window.chhotiLoader.onProgress((msg) => {
          statusEl.textContent = msg;
        });
        window.chhotiLoader.onError((data) => {
          bar.style.display = 'none';
          statusEl.textContent = 'CHHOTI DON could not start.';
          errorBox.style.display = 'block';
          errReason.textContent = (data && data.reason) || 'Unknown error.';
          if (data && data.service) {
            document.getElementById('err-title').textContent = 'Startup problem: ' + data.service;
          }
          if (data && data.hint) {
            errLog.innerHTML = data.hint;
          } else if (data && data.log) {
            errLog.innerHTML = 'Log: <code>' + data.log + '</code>';
          }
        });
      }
      document.getElementById('retry').addEventListener('click', () => {
        errorBox.style.display = 'none';
        bar.style.display = 'block';
        statusEl.textContent = 'Retrying…';
        window.chhotiLoader && window.chhotiLoader.retry();
      });
    </script>
  </body>
</html>
